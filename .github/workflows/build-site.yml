name: Docusaurus Site Build

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'drafts/**'
      - '.vscode/**'
  push:
    paths-ignore:
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'drafts/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docusaurus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Set up verified npm 12 to enforce allowScripts
        run: bash scripts/install-ci-npm.sh

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test TheCleaners URL canonicalization
        run: npm run test:url-case

      - name: Build site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docusaurus-build
          path: build
          if-no-files-found: error
